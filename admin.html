<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap">
<style>

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f3e8;--card:#fffdf6;--ink:#000;--mute:#111;--head:#000;--green:#2f6b3a;--green2:#1f4d29;--gold:#c8962e;--line:#e3dcc6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--head:#8fd09b;--bg:#141a12;--card:#1d2619;--ink:#eef2e6;--mute:#a3ad98;--green:#5fae6d;--green2:#8fd09b;--gold:#e0b04e;--line:#2f3a2a}}
:root[data-theme="dark"]{--head:#8fd09b;--bg:#141a12;--card:#1d2619;--ink:#eef2e6;--mute:#a3ad98;--green:#5fae6d;--green2:#8fd09b;--gold:#e0b04e;--line:#2f3a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Amiri,Tahoma,Arial,serif;line-height:1.85;font-size:16px;-webkit-font-smoothing:antialiased}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#1f4d29;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1f4d29;z-index:10}
header h1{font-family:Amiri,serif;font-weight:400;font-size:1.7rem;line-height:1.2;margin:0;color:#f3d98b;letter-spacing:0}
header h1 .lf{font-size:1.4rem}
.cartbtn{background:var(--gold);color:#1f2a1c;border:0;border-radius:20px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.hero{text-align:center;padding:16px 16px 18px;background:linear-gradient(160deg,var(--green),var(--green2));color:#fff;
background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 12px,transparent 12px 24px),linear-gradient(160deg,var(--green),var(--green2))}
.hero h2{font-family:Amiri,serif;font-weight:400;margin:0 0 4px;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.4;color:#f6e3a6;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.hero h2::after{content:"❖";display:block;font-family:Amiri,serif;font-size:.8rem;line-height:1.2;color:var(--gold);margin-top:0}
.hero p{margin:0 0 10px;opacity:.92;font-size:1rem;line-height:1.6;font-weight:400}.hero .btn{padding:6px 16px;font-size:1rem}
.btn{background:var(--gold);color:#1f2a1c;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
main{max-width:1000px;margin:0 auto;padding:20px 14px}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;color:var(--mute);font-size:.9rem;font-weight:700}
.badges span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:5px 14px;font:inherit;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pic{height:120px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:Amiri,serif;font-size:1.6rem;color:#f3e6bd;text-align:center;padding:6px}
.card h3{font-family:Amiri,serif;font-weight:400;margin:0;font-size:1.2rem;line-height:1.6}.card small{color:var(--mute);font-weight:700}.card h3{font-weight:700}
h2,h3{font-family:Amiri,serif;font-weight:400}
.sec{font-size:1.9rem;margin:6px 0 12px;color:var(--head);font-weight:700;line-height:1.5}
.btn,.cartbtn,.add,.tab,.price,.total{font-family:Amiri,Tahoma,serif;font-weight:700}
.btn{font-size:1.05rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-weight:700;color:var(--green)}
select,input,textarea{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.card select{width:auto}
.add{background:var(--green);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#ov.show{display:block}
#panel{position:absolute;top:0;bottom:0;left:0;width:min(420px,100%);background:var(--card);padding:16px;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
label{display:block;margin:10px 0 3px;font-weight:600;font-size:.9rem}
.total{font-size:1.1rem;font-weight:700;margin:12px 0}
footer{text-align:center;background:#1f4d29;color:#d9e6cf;padding:28px 14px;font-size:.9rem;margin-top:10px}
header{flex-wrap:wrap}html{scroll-padding-top:calc(105px + env(safe-area-inset-top,0px))}
#menu{flex-basis:100%;display:flex;gap:22px;overflow-x:auto;white-space:nowrap;margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2)}
#menu a{color:#fff;text-decoration:none;font-weight:700;padding:2px 0;border-bottom:2px solid transparent;cursor:pointer}
#menu a:hover,#menu a:focus{border-color:var(--gold);color:#f3d98b}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.box h3{margin:0 0 4px;font-size:1.3rem;color:var(--head);font-weight:700}.box p{margin:0;color:var(--mute);font-size:.95rem;font-weight:700}
.about{max-width:1000px;margin:0 auto;padding:10px 14px 24px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700;padding:10px 0;font-size:1.05rem}
details p,details li{color:var(--ink);margin:6px 0}
.dev{direction:ltr;unicode-bidi:isolate;font-weight:700;color:#f3d98b}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:30;overflow-y:auto}.ovl.show{display:block}
.pnl{background:var(--card);max-width:560px;margin:calc(16px + env(safe-area-inset-top,0px)) auto 16px;border-radius:14px;padding:16px;width:calc(100% - 24px)}
.big{width:100%;max-height:340px;object-fit:cover;border-radius:10px;margin:10px 0;display:block}
.pic{overflow:hidden;cursor:pointer}.pic img{width:100%;height:100%;object-fit:cover}.pic.big{height:200px;max-height:none}
.pnl ul{padding-inline-start:20px;margin:8px 0}.pnl hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.hid{display:none!important}.box ul{padding-inline-start:18px;margin:6px 0;color:var(--mute);font-size:.9rem}#menu a.on{border-color:var(--gold);color:#f3d98b}
.soc{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}.soc a{border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:20px;padding:4px 18px;text-decoration:none}.soc a:hover{background:#f3d98b;color:#1f4d29}.soc a.ico{display:inline-flex;align-items:center;justify-content:center;padding:4px 12px}
.fl{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.22)}
.fl a{color:#fff;text-decoration:none;cursor:pointer;font-weight:400}.fl a:hover{color:#f3d98b}

.cols{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:860px){.cols{grid-template-columns:1fr 1fr}}
.ac{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ac h3{margin:0 0 6px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:92%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 16px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.25);font-weight:700}
.toast:empty{display:none}
.hbtns{display:flex;gap:8px;align-items:center}
.hbtns a{text-decoration:none}
</style>
</head>
<body>
<header><h1>لوحة الإدارة</h1>
<div class="hbtns"><a class="cartbtn" href="index.html">عرض المتجر</a><button class="cartbtn hid" id="lo" data-lo="1">تسجيل الخروج</button></div></header>
<main id="app"><p>جاري التحميل...</p></main>
<div class="toast" id="am"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SB_URL="https://rqgrbhwpxfdpfzjumrpw.supabase.co";
var SB_KEY="sb_publishable_MaSer_Qf6JzslYcZwrh1AQ_blJsE9iB"; // مفتاح عام، آمن في الواجهة
var BUCKET="product-images";
var sb=null,SOC={},PRODUCTS=[],pend="",pendBlob=null,tm=null;
try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function mapRow(r){return{id:r.id,n:r.name,c:r.category,d:r.description||"",i:r.info||"",o:r.options,img:r.img_url||""}}
function msg(t,bad){var m=$("am");m.style.color=bad?"#c0392b":"var(--ink)";m.textContent=t;clearTimeout(tm);if(t)tm=setTimeout(function(){m.textContent=""},7000)}

async function isAdmin(){
 try{var s=await sb.auth.getSession(),u=s.data&&s.data.session&&s.data.session.user;
  if(!u)return false;
  var r=await sb.from("admins").select("user_id").eq("user_id",u.id).maybeSingle();
  return !!(r.data)}catch(e){return false}}
async function loadProducts(){var r=await sb.from("products").select("*").order("id");if(r.error)throw r.error;PRODUCTS=(r.data||[]).map(mapRow)}
async function loadSocial(){try{var r=await sb.from("settings").select("value").eq("key","social").maybeSingle();if(r.data&&r.data.value)SOC=r.data.value}catch(e){}}

function loginRender(){
 $("lo").classList.add("hid");
 $("app").innerHTML='<div class="ac" style="max-width:420px;margin:30px auto"><h2 class="sec" style="margin-top:0">دخول المشرف</h2><label>البريد الإلكتروني</label><input id="lem" type="email" dir="ltr" autocomplete="username"><label>كلمة المرور</label><input id="lpw" type="password" dir="ltr" autocomplete="current-password"><button class="btn" data-login="1" style="width:100%;margin-top:12px">دخول</button></div>';
 $("lpw").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin()})}

async function doLogin(){
 var em=$("lem").value.trim(),pw=$("lpw").value;
 if(!em||!pw){msg("أدخل البريد وكلمة المرور.",1);return}
 msg("جاري الدخول...");
 try{var r=await sb.auth.signInWithPassword({email:em,password:pw});
  if(r.error){msg("البريد أو كلمة المرور غير صحيحة.",1);return}
  if(await isAdmin()){msg("");await enter()}
  else{await sb.auth.signOut();msg("هذا الحساب ليس مشرفاً.",1)}
 }catch(x){msg("تعذر الاتصال: "+((x&&x.message)||x),1)}}

async function enter(){
 try{await Promise.all([loadProducts(),loadSocial()])}catch(x){msg("تعذر تحميل البيانات: "+((x&&x.message)||x),1)}
 $("lo").classList.remove("hid");render(null)}

function render(eid){
 var f=eid==null?{}:(PRODUCTS.filter(function(x){return x.id==eid})[0]||{});pend=f.img||"";pendBlob=null;
 var list=PRODUCTS.length?PRODUCTS.map(function(p){return '<div class="item"><span>'+esc(p.n)+'</span><span><button class="tab" data-ed="'+p.id+'">تعديل</button> <button class="tab" data-del="'+p.id+'">حذف</button></span></div>'}).join(""):'<p style="color:var(--mute)">لا توجد منتجات بعد. أضف أول منتج من النموذج.</p>';
 var h='<div class="cols"><div class="ac"><h2 class="sec" style="margin-top:0">إدارة المنتجات</h2>'+list+'</div>'+
 '<div class="ac" id="fcard"><h2 class="sec" style="margin-top:0">'+(eid==null?'منتج جديد':'تعديل المنتج')+'</h2><label>الاسم</label><input id="fn" value="'+esc(f.n)+'"><label>الفئة (مثل: أعشاب، زهور، توابل)</label><input id="fc" value="'+esc(f.c||"أعشاب")+'"><label>وصف المنتج</label><textarea id="fd" rows="3">'+esc(f.d)+'</textarea><label>معلومات إضافية (كل معلومة في سطر)</label><textarea id="fi" rows="3">'+esc(f.i)+'</textarea><label>الأحجام والأسعار (سطر لكل حجم، مثال: 100 G=25)</label><textarea id="fo" rows="3">'+esc((f.o||[["100 G",20]]).map(function(o){return o[0]+"="+o[1]}).join("\n"))+'</textarea><label>صورة المنتج</label><input type="file" id="ff" accept="image/*"><img id="fp" class="big" '+(f.img?'src="'+esc(f.img)+'"':'hidden')+'>'+
 '<button class="btn" data-sv="'+(eid==null?'':eid)+'" style="width:100%">حفظ المنتج</button>'+(eid!=null?'<button class="tab" data-new="1" style="width:100%;margin-top:8px">إلغاء التعديل / منتج جديد</button>':'')+'</div></div>'+
 '<div class="ac" style="margin-top:14px"><h2 class="sec" style="margin-top:0">روابط الحسابات</h2><label>فيسبوك</label><input id="sfb" dir="ltr" placeholder="https://" value="'+esc(SOC.fb)+'"><label>إنستغرام</label><input id="sig" dir="ltr" placeholder="https://" value="'+esc(SOC.ig)+'"><label>تيك توك</label><input id="stt" dir="ltr" placeholder="https://" value="'+esc(SOC.tt)+'"><button class="btn" data-ss="1" style="width:100%;margin-top:8px">حفظ الروابط</button><p style="color:var(--mute);margin-bottom:0">التغييرات تُحفظ مباشرة وتظهر للزبائن فوراً.</p></div>';
 $("app").innerHTML=h;
 if(eid!=null)$("fcard").scrollIntoView({behavior:"smooth",block:"start"})}

document.addEventListener("click",async function(e){
 var t=e.target.closest&&e.target.closest("button");if(!t)return;
 if(t.dataset.login){doLogin();return}
 if(t.dataset.lo){await sb.auth.signOut();PRODUCTS=[];loginRender();return}
 if(t.dataset.ed){render(+t.dataset.ed);return}
 if(t.dataset.new){render(null);return}
 if(t.dataset.del){
  if(t.dataset.arm!=="1"){t.dataset.arm="1";t.textContent="تأكيد الحذف";return}
  try{var r=await sb.from("products").delete().eq("id",+t.dataset.del).select();
   if(r.error)throw r.error;
   if(!r.data||!r.data.length)throw new Error("لا تملك صلاحية الحذف");
   await loadProducts();render(null);msg("تم الحذف.")
  }catch(x){msg("تعذر الحذف: "+((x&&x.message)||x),1)}
  return}
 if(t.dataset.sv!==undefined){
  var n=$("fn").value.trim(),os=$("fo").value.split("\n").map(function(l){var a=l.split("=");return[(a[0]||"").trim(),parseFloat(a[1])]}).filter(function(a){return a[0]});
  if(!n||!os.length||os.some(function(a){return !(a[1]>0)})){msg("أدخل الاسم وحجماً واحداً على الأقل بصيغة «100 G=25».",1);return}
  t.disabled=true;msg("جاري الحفظ...");
  try{
   var url=pend||"";
   if(pendBlob){
    var path=Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg";
    var up=await sb.storage.from(BUCKET).upload(path,pendBlob,{contentType:"image/jpeg",cacheControl:"31536000"});
    if(up.error)throw up.error;
    url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
   }
   var row={name:n,category:$("fc").value.trim()||"أعشاب",description:$("fd").value.trim(),info:$("fi").value.trim(),options:os,img_url:url||null},res;
   if(t.dataset.sv)res=await sb.from("products").update(row).eq("id",+t.dataset.sv).select();
   else res=await sb.from("products").insert(row).select();
   if(res.error)throw res.error;
   if(!res.data||!res.data.length)throw new Error("لم يُحفظ التغيير، تحقق من صلاحيات المشرف");
   await loadProducts();render(null);window.scrollTo(0,0);msg("تم حفظ «"+n+"» وظهر للزبائن.")
  }catch(x){t.disabled=false;msg("تعذر الحفظ: "+((x&&x.message)||x),1)}
  return}
 if(t.dataset.ss){
  var S={fb:$("sfb").value.trim(),ig:$("sig").value.trim(),tt:$("stt").value.trim()};
  try{var r2=await sb.from("settings").upsert({key:"social",value:S});
   if(r2.error)throw r2.error;
   SOC=S;msg("تم حفظ الروابط (تُقبل فقط روابط تبدأ بـ https://).")
  }catch(x){msg("تعذر حفظ الروابط: "+((x&&x.message)||x),1)}
 }
});

// معالجة الصورة: تصغير ثم رفع عند الحفظ
document.addEventListener("change",function(e){if(e.target.id!="ff")return;var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);pend=c.toDataURL("image/jpeg",.82);c.toBlob(function(b){pendBlob=b},"image/jpeg",.82);$("fp").src=pend;$("fp").hidden=false};im.src=r.result};r.readAsDataURL(f)});

(async function(){
 if(!sb){$("app").innerHTML='<p>تعذر الاتصال بقاعدة البيانات.</p>';return}
 if(await isAdmin())await enter();else loginRender()
})();
</script>
</body>
</html>

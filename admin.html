<script type="text/plain" id="sql-src">
create table if not exists public.visits(
  id bigint generated always as identity primary key,
  day date not null default current_date,
  vid text not null,
  created_at timestamptz not null default now(),
  unique(day, vid)
);
alter table public.visits enable row level security;
drop policy if exists "visits insert" on public.visits;
create policy "visits insert" on public.visits
  for insert to anon, authenticated
  with check (length(vid) between 8 and 64);

create or replace function public.visits_daily(d int default 90)
returns table(day date, n bigint)
language sql security definer set search_path = public as $$
  select v.day, count(*)::bigint
  from public.visits v
  where v.day >= current_date - d
    and exists (select 1 from public.admins a where a.user_id = auth.uid())
  group by v.day order by v.day
$$;
revoke all on function public.visits_daily(int) from public;
grant execute on function public.visits_daily(int) to authenticated;
</script>

document.addEventListener("click",async function(e){
 var t=e.target.closest&&e.target.closest("button");if(!t)return;var D=t.dataset;
 if(D.login){doLogin();return}
 if(D.lo){await sb.auth.signOut();PRODUCTS=[];loginRender();return}
 if(D.tab){if((dirtyCount()||(TAB==="packs"&&PKDIRTY))&&!confirm("لديك تغييرات غير محفوظة. المتابعة بدون حفظ؟"))return;TAB=D.tab;render();return}
 if(D.vr){VRANGE=+D.vr;if(VD)drawVisits();return}
 if(D.vref){rVisits();return}
 if(D.copy){var pe=$(D.copy);try{await navigator.clipboard.writeText(pe.textContent);msg("تم النسخ.")}catch(x){msg("تعذر النسخ، حدّد النص يدوياً.",1)}return}
 if(D.cf!=null){CF=D.cf;drawCF();applyCF();return}
 if(D.addpk){var w0=$("pkw");w0.insertAdjacentHTML("beforeend",pkcard(null));var nc=w0.lastElementChild;nc.querySelector(".pkn").focus();nc.scrollIntoView({block:"center",behavior:"smooth"});PKDIRTY=true;return}
 if(D.pkdel){if(D.arm!=="1"){D.arm="1";t.textContent="تأكيد الحذف";return}t.closest(".pk").remove();PKDIRTY=true;return}
 if(D.pksave){await savePacks(t);return}
 if(D.xtpl){
  if(typeof XLSX==="undefined"){msg("تعذر تحميل مكتبة Excel.",1);return}
  var ws=XLSX.utils.aoa_to_sheet([["اسم المنتج","الوصف","معلومات","الثمن","الكتلة","الفئة"],["زعتر بلدي","زعتر مجفف طبيعي","يحفظ في مكان جاف",25,"100 G","أعشاب"],["زعتر بلدي","","",90,"500 G",""],["إكليل الجبل","","",30,"250 G","أعشاب"]]),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Products");XLSX.writeFile(wb,"products-template.xlsx");return}
 if(D.addp){$("pt").insertAdjacentHTML("beforeend",prow(null));var nr=$("pt").lastElementChild;nr.querySelector(".pn").focus();nr.scrollIntoView({block:"center",behavior:"smooth"});drawCF();return}
 if(D.addsz){t.insertAdjacentHTML("beforebegin",srow("",""));mark(t.closest("tr"));return}
 if(D.rmsz){var tr0=t.closest("tr"),sz=t.closest(".sz");sz.remove();if(!tr0.querySelector(".sz"))tr0.querySelector("[data-addsz]").insertAdjacentHTML("beforebegin",srow("",""));mark(tr0);return}
 if(D.pdel){
  var tr1=t.closest("tr");
  if(D.arm!=="1"){D.arm="1";t.textContent="تأكيد الحذف";return}
  if(!tr1.dataset.id){tr1.remove();mark(null);drawCF();return}
  try{var r=await sb.from("products").delete().eq("id",+tr1.dataset.id).select();
   if(r.error)throw r.error;
   if(!r.data||!r.data.length)throw new Error("لا تملك صلاحية الحذف");
   PRODUCTS=PRODUCTS.filter(function(p){return p.id!=tr1.dataset.id});tr1.remove();mark(null);drawCF();msg("تم الحذف.")
  }catch(x){msg("تعذر الحذف: "+((x&&x.message)||x),1)}
  return}
 if(D.psave){await saveProducts(t);return}
 if(D.ss){
  var S={fb:$("sfb").value.trim(),ig:$("sig").value.trim(),tt:$("stt").value.trim()};
  try{var r2=await sb.from("settings").upsert({key:"social",value:S});if(r2.error)throw r2.error;SOC=S;msg("تم حفظ الروابط.")}
  catch(x){msg("تعذر حفظ الروابط: "+((x&&x.message)||x),1)}
  return}
 if(D.sapp){
  var A={track:$("atrk").checked};
  try{var r5=await sb.from("settings").upsert({key:"app",value:A});if(r5.error)throw r5.error;APP=A;msg("تم حفظ إعدادات الخصوصية.")}
  catch(x){msg("تعذر الحفظ: "+((x&&x.message)||x),1)}
  return}
 if(D.spw){
  var a1=$("pw1").value,a2=$("pw2").value;
  if(a1.length<8){msg("كلمة المرور يجب ألا تقل عن 8 أحرف.",1);return}
  if(a1!==a2){msg("كلمتا المرور غير متطابقتين.",1);return}
  try{var rp=await sb.auth.updateUser({password:a1});if(rp.error)throw rp.error;$("pw1").value="";$("pw2").value="";msg("تم تغيير كلمة المرور.")}
  catch(x){msg("تعذر تغيير كلمة المرور: "+((x&&x.message)||x),1)}
  return}
 if(D.sts){
  var Sv=readStyle();
  try{var r3=await sb.from("settings").upsert({key:"style",value:Sv});if(r3.error)throw r3.error;STY=Sv;msg("تم حفظ المظهر.")}
  catch(x){msg("تعذر حفظ المظهر: "+((x&&x.message)||x),1)}
  return}
 if(D.str){
  try{var r4=await sb.from("settings").upsert({key:"style",value:{}});if(r4.error)throw r4.error;
   STY=null;applyStyle(null);
   var ids={sfs:"fs",sbg:"bg",scd:"card",sin:"ink",shd:"head",sgr:"green",sgo:"gold",shr:"hdr"};
   for(var id in ids)$(id).value=DEF_STY[ids[id]];$("sfv").textContent=DEF_STY.fs;msg("أُعيد المظهر الافتراضي.")}
  catch(x){msg("تعذر إعادة الضبط: "+((x&&x.message)||x),1)}
 }
});

function onEdit(e){var t=e.target;
 if(t.dataset&&t.dataset.sty){var v=readStyle();$("sfv").textContent=v.fs;applyStyle(v);return}
 if(t.closest&&t.closest("#pkw")){PKDIRTY=true;return}
 var tr=t.closest&&t.closest("#pt tr");if(tr){mark(tr);if(t.classList.contains("pc"))drawCF()}}
document.addEventListener("input",onEdit);
document.addEventListener("change",function(e){
 var t=e.target;
 if(t.id==="xf"){importXl(t);return}
 if(t.classList&&t.classList.contains("pf")){
  var f=t.files[0],tr=t.closest("tr");if(!f)return;
  resizeImg(f,function(d,b){tr._blob=b;var im=tr.querySelector(".th");im.src=d;im.hidden=false;mark(tr)});return}
 if(t.classList&&t.classList.contains("pkf")){var f2=t.files[0],c2=t.closest(".pk");if(!f2)return;resizeImg(f2,function(d,b){c2._blob=b;var im2=c2.querySelector(".pkth");im2.src=d;im2.hidden=false;c2.querySelector(".pkph").hidden=true;PKDIRTY=true});return}
 if(t.classList&&t.classList.contains("pcs")){var tr3=t.closest("tr"),inp=tr3.querySelector(".pc");if(t.value==="__o"){inp.hidden=false;inp.value="";inp.focus()}else{inp.hidden=true;inp.value=t.value}mark(tr3);drawCF();return}
 onEdit(e)});
